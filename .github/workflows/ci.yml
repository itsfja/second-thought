name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check sync
        run: python tools/sync.py --check

      - name: Run tests
        run: |
          bash tests/setup.sh
          python tests/run_tests.py

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests on Windows
        shell: bash
        env:
          PYTHONUTF8: "0"
        run: |
          set +e
          { bash tests/setup.sh && python tests/run_tests.py; } > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then
            # Show the failures on the run's summary page, not just deep in the log.
            msg=$( (grep -E "FAIL|Error|Traceback|error:" test-output.txt | head -40; echo "-----"; tail -60 test-output.txt) | cut -c1-300)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Windows test failures::$msg"
          fi
          exit $status
