name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Whether a pull request changes anything but Markdown. The end-to-end jobs (the slow ones) are skipped when it
  # doesn't; the unit tests always run, since some of them read README.md, CHANGELOG.md and gallery/README.md.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          other=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -v '\.md$' || true)
          echo "Changed, not Markdown: ${other:-none}"
          echo "code=$([ -n "$other" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint:
    # Ruff: unused and undefined names and likely bugs in the runtime's parts and the tools (ruff.toml, #313). Seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format github .

  unit:
    # The runtime's parts on their own: seconds, nothing to install, every Python an exported program might meet.
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
        include:
          # ubuntu-latest is Ubuntu 26.04 from October 2026, which has no Python 3.9 build; 24.04 still has one.
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check sync
        run: python tools/sync.py --check

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Editor unit tests
        # The page's own functions in Node, no browser: seconds (tests/editor).
        run: node --test "tests/editor/*.test.cjs"

  # The suite runs in five parts side by side, each on its own runner, so the stand-in services' fixed ports never
  # clash. page and the python shares begin with the same page run (python checks what the page exported). Share 1
  # runs the Python checks that aren't per-program and shares 2 and 3 the exported programs, so each takes about as
  # long as the page part (#342).
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.areas }})
    strategy:
      fail-fast: false
      matrix:
        areas: [ "page", "python --share 1/3", "python --share 2/3", "python --share 3/3", "sources i18n gallery" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check sync
        run: python tools/sync.py --check

      - name: Run tests
        run: |
          bash tests/setup.sh
          python tests/run_tests.py ${{ matrix.areas }}

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: windows (${{ matrix.areas }})
    strategy:
      fail-fast: false
      matrix:
        areas: [ "page", "python --share 1/3", "python --share 2/3", "python --share 3/3", "sources i18n gallery" ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests on Windows
        shell: bash
        env:
          PYTHONUTF8: "0"
        run: |
          set +e
          { bash tests/setup.sh && python tests/run_tests.py ${{ matrix.areas }}; } > test-output.txt 2>&1
          status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then
            # Show the failures on the run's summary page, not just deep in the log.
            # Only the failures: a passing check's line can contain FAIL (like "keeping ok, FAIL and NOTE"), and dozens of
            # those used to fill the annotation, so GitHub cut it off before the real error at the end.
            out=$(tr -d '\r' < test-output.txt | grep -v "^  ok ")
            msg=$( (echo "$out" | grep -E "^  FAIL |Traceback|^[A-Za-z_.]*(Error|Exception)\b" | head -20; echo "-----"; echo "$out" | tail -40) | cut -c1-300)
            msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/}"; msg="${msg//$'\n'/'%0A'}"
            echo "::error title=Windows test failures (${{ matrix.areas }})::$msg"
          fi
          exit $status
