; =====================================================================================================
;  second-thought.example.ini: every setting an exported Second Thought program understands
; =====================================================================================================
;
;  How to use it
;  -------------
;  Every exported program comes with its own second-thought.ini, holding just the settings that program
;  needs. This file lists all of them, with notes, so you can see what's possible or build one ini that
;  serves all your programs.
;
;  Copy it to second-thought.ini, then fill in what you use. Settings come in three layers, each one
;  over the one before:
;    1. ST_ environment variables, for every program on this computer: the setting's name after ST_,
;       such as ST_EMAIL_ADDRESS or ST_CURRENCY (on Windows: setx ST_CURRENCY gbp, then open a new window)
;    2. second-thought.ini in your home folder, for what's common to your programs (email, keys, currency)
;    3. this program's own second-thought.ini: wherever SECOND_THOUGHT_INI points (an environment
;       variable, not a setting in this file), else the one next to the program, else the one in the
;       folder you run it from
;  So a program's own file only needs what's particular to it. SECOND_THOUGHT_HOME_INI (also an
;  environment variable) names a different file for layer 2. --doctor says where each key came from.
;
;  Rules
;  -----
;  - Lines starting with ; or # are notes. Most settings below are notes: remove the ; to use one.
;  - A setting left empty (NAME = ) is ignored, so the blank keys below are safe to leave as they are.
;  - Upper or lower case doesn't matter in names. The [section] headings are only for tidiness: any
;    setting works in any section.
;  - A real environment variable with the same name (ANTHROPIC_API_KEY, RB_BUDGET) wins over all three
;    layers. ST_ variables and files never hold passwords more safely than each other: for those,
;    see the keychain below.
;  - A value can't contain " ;" or " #" (a space then ; or #): everything after it counts as a note.
;    Quotes round a value are removed, so "my value" and my value are the same.
;  - Keep this file private once it holds keys. Don't email it or put it on GitHub.


; =====================================================================================================
[keys]
; =====================================================================================================
; Only the services your program uses need a key. Each is billed by that service, separately from
; claude.ai. The address after each name is where to get a key.

; Claude: https://console.anthropic.com. Every program needs this one.
ANTHROPIC_API_KEY =
; Only for a key made for the whole Console organisation rather than one workspace: the workspace to use, from
; the Console's Workspaces page. A key made inside a workspace doesn't need it.
; ANTHROPIC_WORKSPACE_ID =

; Gemini: https://aistudio.google.com. GOOGLE_API_KEY works too. Needs: pip install google-genai
GEMINI_API_KEY =
; GOOGLE_API_KEY =

; DeepSeek: https://platform.deepseek.com
DEEPSEEK_API_KEY =

; Grok, from xAI: https://console.x.ai
XAI_API_KEY =

; OpenAI: https://platform.openai.com (an API account, not a ChatGPT plan)
OPENAI_API_KEY =

; Mistral: https://console.mistral.ai
MISTRAL_API_KEY =

; Qwen, from Alibaba Cloud Model Studio: https://modelstudio.console.alibabacloud.com. QWEN_API_KEY works too.
DASHSCOPE_API_KEY =
; QWEN_API_KEY =

; Kimi, from Moonshot AI: https://platform.moonshot.ai. KIMI_API_KEY works too.
MOONSHOT_API_KEY =
; KIMI_API_KEY =

; Open models on Hugging Face: https://huggingface.co/settings/tokens. HUGGINGFACE_API_KEY works too.
HF_TOKEN =
; HUGGINGFACE_API_KEY =

; Groq (very fast open models): https://console.groq.com
GROQ_API_KEY =

; GLM, from Z.ai: https://z.ai/manage-apikey/apikey-list. ZHIPUAI_API_KEY works too.
ZAI_API_KEY =
; ZHIPUAI_API_KEY =

; MiniMax: https://platform.minimax.io
MINIMAX_API_KEY =

; OpenRouter, one key for hundreds of models: https://openrouter.ai/keys
OPENROUTER_API_KEY =

; Perplexity (always searches the web): https://www.perplexity.ai/account/api
PERPLEXITY_API_KEY =


; =====================================================================================================
[models]
; =====================================================================================================
; primary: the model that does every step. Leave it as a note to use the one chosen on the page when
; the program was exported. ('model' means the same.)
;   Claude:      quick, default, complex
;   Gemini:      gemini-quick, gemini-default, gemini-complex
;   Llama:       llama-quick, llama-default, llama-complex
;   DeepSeek:    deepseek-default, deepseek-complex
;   Grok (xAI):  xai-default, xai-complex
;   OpenAI:      openai-quick, openai-default, openai-complex
;   Mistral:     mistral-quick, mistral-default, mistral-complex
;   Qwen:        qwen-quick, qwen-default, qwen-complex
;   Kimi:        kimi-default, kimi-complex
;   Perplexity:  perplexity-quick, perplexity-default, perplexity-complex
;   Hugging Face: hf-quick, hf-default, hf-complex
;   Groq:        groq-quick, groq-default, groq-complex
;   GLM:         glm-default, glm-complex
;   MiniMax:     minimax-quick, minimax-default
;   OpenRouter:  openrouter-default (it picks a model each step), or openrouter:<any model name from
;                https://openrouter.ai/models>, like openrouter:mistralai/mistral-small
; primary = default

; backups: models to try, in order, when the primary fails on a step (no key, out of credit, service
; down). Separate them with commas. backups = none turns off the backups set when the program was exported.
; backups = openai-default, gemini-default

; Model names change over time. To use a different model for a tier, without editing the program, add
; MODEL_<tier> with the tier's name in capitals and - as _ (so openai-default is MODEL_OPENAI_DEFAULT):
; MODEL_QUICK = claude-haiku-4-5-20251001
; MODEL_DEFAULT = claude-sonnet-5-5
; MODEL_COMPLEX = claude-opus-5-5
; MODEL_GEMINI_DEFAULT = gemini-3.8-flash
; MODEL_OPENAI_DEFAULT = gpt-6.1-sol
; MODEL_LLAMA_DEFAULT = llama3.2-vision:11b
; The provider's own pages list the current names; each tier's note in the program says where.

; Where a service's text models can't look at pictures, pictures go to one of its models that can:
; QWEN_VISION_MODEL = qwen3-vl-plus
; GROQ_VISION_MODEL = qwen/qwen3.8-27b
; HF_VISION_MODEL = google/gemma-4-31B-it


; =====================================================================================================
[run]
; =====================================================================================================
; budget: stop a run before a model call once it has used this many tokens (sent plus received).
; 0, or leaving it out, means no limit. A 'limit this run' block in the program wins over this.
; budget = 50000

; budget_dollars: the same in US dollars, at the models' list prices: stop a run before a model call once it has
; spent this much. A model with no known price can't be counted, so the run stops rather than going on with no
; limit. 0, or leaving it out, means no limit. A 'limit this run' block in US dollars wins over this.
; budget_dollars = 0.50

; currency: show costs and money budgets in usd (the default), gbp, eur, jpy or cny. Services charge in US dollars,
; so the program converts at the European Central Bank's rate of the day, fetched once a day and kept next to the
; program; offline, it uses the last one kept, or one built into the program.
; currency = gbp
; exchange_rate: one US dollar in your currency, instead of the ECB's rate: for programs that shouldn't depend on it.
; exchange_rate = 0.79
; rates_url: where the day's rates are fetched from, if not the ECB's daily file (a mirror, or a proxy that allows it).
; rates_url = https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
; budget_money: a money budget in your currency, like budget_dollars. It wins over budget_dollars.
; budget_money = 0.40

; quota_hourly, quota_daily, quota_weekly, quota_monthly: allowances for each key, in your currency, counted across
; every run of every program on this computer (in a file next to memory.json, which keeps a hash of each key, never the
; key). A run stops before a model call once a key has spent its allowance, and says when it resets: hours, days
; (midnight), weeks (Monday) and months in local time. Programs on other computers, and claude.ai, aren't counted.
; On GitHub Actions the tally starts afresh each run. A model with no known price can't be counted, so it's refused.
; quota_daily = 1.00
; quota_monthly = 20.00
; quota_hourly = 0.25
; quota_weekly = 5.00
; quota_daily_claude = 2.00   one service's own allowance wins: quota_<window>_<service>, like quota_monthly_openai

; PLAN_<SERVICE>: which plan an account is on, as the service names it. Where the service publishes a monthly spend
; cap, the program counts this computer's spending against it and stops before a call once it's reached, rather than
; having the service refuse it. Claude: evaluation, start ($500 a month), build ($1,000), scale ($200,000) or custom.
; OpenAI: free ($100), build ($500), launch ($5,000) or grow ($200,000). Gemini: free, tier 1, tier 2 or tier 3, and
; Groq: free or developer (no monthly cap published). Your account's own limits page has the figures for your account.
; PLAN_CLAUDE = start
; PLAN_OPENAI = build

; max_seconds: stop any run that takes longer than this, in seconds, whatever it's doing. 0, or leaving
; it out, means no limit (each run is still limited to 60 model calls and 20,000 steps).
; max_seconds = 900

; call_timeout: give up on one model call after this many seconds. 300 if you leave it out;
; 0 means no timeout (a call waits as long as the service takes).
; A number that isn't a number (budget, budget_dollars, budget_money, exchange_rate, max_seconds, call_timeout) stops the program with a message saying which.
; call_timeout = 120

; save_log = yes writes each run's log, with every prompt sent, to the logs folder next to the program.
; save_log = yes

; stream: show Claude writing as it goes. Normally only when you run the program in a terminal yourself.
; stream = yes

; resume: if a run stopped part-way, pick up where it stopped next time, reusing the answers it already
; had. yes or no. Normally it asks you in a terminal, and doesn't resume when nobody is there to ask.
; resume = yes

; approve: a program that can act on the world (send email or messages, control devices, publish MQTT,
; accept web requests, comment on GitHub) lists what it can do and asks you before its first run, and
; again whenever the program file changes. A scheduled run that was never approved stops instead.
; approve = no skips the question: for a computer with nobody at it, once you've read the program's list.
; approve = no

; approve_by: when a run with nobody at the keyboard reaches something that must ask first (a confirm block, an
; action with "ask me before", an unlock, a money move), where the question goes. Not set: the run refuses it.
; approve_by = telegram sends the question to your Telegram (TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID above) with a
; fresh four-digit code; only a reply from your chat with that code, within five minutes, allows it, and each code
; works once. Anyone who can read your Telegram can allow it, so the phone that reads it should be yours.
; approve_by = telegram

; keychain: with the keyring package installed (pip install keyring), keys missing from here and from the
; environment are looked up in your computer's keychain, under the name second-thought. Store one with:
;   python -m keyring set second-thought ANTHROPIC_API_KEY
; keychain = no turns this off.
; keychain = no

; update_check: --doctor asks GitHub whether a newer runtime is out, and says so (a FAIL if it fixes a security
; problem). python this-program.py --update-runtime then puts it into the program file. update_check = no turns the
; check off.
; update_check = no

; releases_url: where that check and --update-runtime look for releases. Only for a copy of Second Thought kept
; somewhere else, like a fork: the address of its GitHub releases list.
; releases_url = https://api.github.com/repos/itsfja/second-thought/releases

; mcp_timeout: how long one MCP tool call may take, in seconds, before the agent is told it didn't answer.
; mcp_timeout = 120

; language: the language the program prints in: its run log, questions, errors and --doctor. A program
; exported while the page showed Spanish speaks Spanish (es); language = en switches it back to English.
; language = en

; Where 'forever' and timed memories are kept. Normally memory.json, next to the program. Two programs
; can share one file, but not while both are writing to it: whichever saves last wins.
; RB_MEMORY_FILE = C:\Users\me\second-thought-memory.json


; =====================================================================================================
[feeds and pages]
; =====================================================================================================
; feeds: your news feeds (RSS or Atom addresses), separated by spaces. 'news from feed' with nothing in
; it, the news feed tool and the 'when there's something new in feed' listener read these.
; feeds = https://example.com/feed.xml https://example.org/atom.xml

; local_pages = yes lets the agent read web pages and feeds on your own network too. Normally it only
; reads public ones, in case something it reads tries to steer it at your router or your server.
; Addresses in your own settings (feeds, CALENDAR_URL) are always allowed.
; local_pages = yes


; =====================================================================================================
[home assistant]
; =====================================================================================================
; Your Home Assistant's address, and a long-lived access token: in Home Assistant, open your profile,
; then the Security tab, then 'Long-lived access tokens'.
HA_URL = http://homeassistant.local:8123
HA_TOKEN =
; The text-to-speech service the 'say … on' block uses.
; HA_TTS_ENTITY = tts.home_assistant_cloud


; =====================================================================================================
[homey]
; =====================================================================================================
; Your Homey's address, and an API key: in the Homey Web App (my.homey.app), Settings, API Keys,
; New API Key. Give it only what your programs need: view devices, control devices, view and start
; flows, view and edit Logic.
;   Homey Pro:                 http://homey-XXXXXXX.local, or its IP address
;   Homey Self-Hosted Server:  the computer's IP address and port 4859, like http://192.168.1.20:4859
;                              (devices on a Homey Bridge connected to it show up there too)
; HOMEY_URL = http://192.168.1.20:4859
HOMEY_API_KEY =


; =====================================================================================================
[mqtt]
; =====================================================================================================
; Your MQTT broker, for example Mosquitto in Home Assistant. Needs: pip install paho-mqtt
; (run.bat and run.sh install it when the program uses MQTT).
; MQTT_HOST = homeassistant.local
; MQTT_PORT = 1883
; MQTT_USERNAME =
; MQTT_PASSWORD =
; MQTT_TLS = yes makes the connection encrypted (and the port 8883 unless you set one).
; MQTT_TLS = yes


; =====================================================================================================
[telegram]
; =====================================================================================================
; Make a bot: in Telegram, message @BotFather and send /newbot. It gives you the token.
TELEGRAM_BOT_TOKEN =
; Your own chat with the bot. Send the bot a message, run a Telegram program, and it tells you the
; number. Anyone can message a bot, so it only listens to, and searches, the chats listed here.
; Several chats can be separated by spaces; messages are sent to the first one.
TELEGRAM_CHAT_ID =
; Only if you use a Telegram Bot API server of your own.
; TELEGRAM_API_URL = https://api.telegram.org


; =====================================================================================================
[discord]
; =====================================================================================================
; A bot: Discord Developer Portal (discord.com/developers), New Application, Bot, Reset Token. On the
; same page turn on 'Message Content Intent', then invite the bot to your server (OAuth2, URL Generator,
; scope bot, permissions Read Message History and Send Messages).
DISCORD_BOT_TOKEN =
; The channels it reads and posts in: right-click a channel, Copy Channel ID (turn on Developer Mode in
; Discord's settings first). Anyone in a server can post, so only these channels count. Several can be
; separated by spaces; messages are sent to the first one unless they're a reply.
DISCORD_CHANNEL_ID =
; Only for testing against a stand-in.
; DISCORD_API_URL = https://discord.com/api/v10


; =====================================================================================================
[slack]
; =====================================================================================================
; A Slack app (api.slack.com/apps): OAuth & Permissions, bot token scopes channels:history,
; groups:history and chat:write. Install it to your workspace and copy the Bot User OAuth Token (xoxb-…).
SLACK_BOT_TOKEN =
; The channels it reads and posts in: open a channel's details; its ID is at the bottom. Invite the bot to
; each with /invite @yourbot. Several can be separated by spaces; messages go to the first one unless
; they're a reply.
SLACK_CHANNEL_ID =
; Only for testing against a stand-in.
; SLACK_API_URL = https://slack.com/api


; =====================================================================================================
[email]
; =====================================================================================================
; Your address and an app password, not your normal password (Gmail: Google account, Security,
; App passwords). Gmail, iCloud, Yahoo and Fastmail work out their own servers.
EMAIL_ADDRESS =
EMAIL_PASSWORD =
; For any other provider, fill in its servers (its help pages list them).
; EMAIL_IMAP_HOST = imap.example.com
; EMAIL_IMAP_PORT = 993
; EMAIL_SMTP_HOST = smtp.example.com
; EMAIL_SMTP_PORT = 465   (465 is encrypted from the start; 587 starts plain and switches to encryption)
; EMAIL_SSL = no only for a mail server on your own network that doesn't do encryption.
; EMAIL_SSL = yes


; =====================================================================================================
[calendar]
; =====================================================================================================
; Your calendar's private iCal address. Several can go on one line, separated by spaces.
;   Google Calendar: Settings, your calendar, 'Secret address in iCal format'
;   Outlook: Settings, Calendar, Shared calendars, Publish a calendar, ICS link
;   iCloud: share the calendar as a public calendar and copy its address (webcal:// works)
CALENDAR_URL =


; =====================================================================================================
[github]
; =====================================================================================================
; A token from https://github.com/settings/tokens. Fine-grained: read access to contents, issues and
; pull requests (contents lets the agent list branches and commits and read files). To let the agent
; comment, open issues and add labels, pull requests and issues need read and write.
GITHUB_TOKEN =
; Only for GitHub Enterprise Server.
; GITHUB_API_URL = https://github.example.com/api/v3


; =====================================================================================================
[web requests]
; =====================================================================================================
; For 'when a web request arrives at /…'. Every request must carry this password, as ?key=… on the
; address or in an X-Second-Thought-Key header, or it's refused. Make it long. Until it's set, the
; program doesn't listen for web requests at all.
WEBHOOK_SECRET =
; The port to listen on, and the address: 127.0.0.1 (the default) means only this computer can reach it,
; which is enough for Home Assistant running on the same machine. 0.0.0.0 means every network the computer
; is on, so Home Assistant on another machine, IFTTT or your phone can reach it too.
; WEBHOOK_PORT = 8765
; WEBHOOK_HOST = 0.0.0.0


; =====================================================================================================
[mcp servers]
; The MCP servers an agent's "tools from MCP server" block uses. Name each one MCP_<NAME>, where <NAME> is the
; name in the block (in capitals, with _ for spaces), and give the command that starts it, or its https:// address.
; A started server gets these settings as its environment, so keys it needs (like GITHUB_PERSONAL_ACCESS_TOKEN)
; can go here too. A server at an address that needs a token gets it from MCP_<NAME>_TOKEN.
; MCP_FILES = npx -y @modelcontextprotocol/server-filesystem /home/me/recipes
; MCP_TRACKER = https://mcp.example.com/mcp
; MCP_TRACKER_TOKEN = your-token
; GitHub's own MCP server (https://github.com/github/github-mcp-server) reads repositories: files, the file tree, code
; search, issues and pull requests. Start it with --read-only, so it offers no tool that can change anything, and give
; it a fine-grained token that can only read (Contents, Issues, Pull requests and Metadata: read-only), made at
; https://github.com/settings/personal-access-tokens. Even without --read-only, its changes ask first; merging, pushing
; and deleting always do, and never run unattended. --doctor says how many of its tools can change things (0 is right).
; With Docker:
; MCP_GITHUB = docker run -i --rm -e GITHUB_PERSONAL_ACCESS_TOKEN ghcr.io/github/github-mcp-server stdio --read-only --toolsets repos,issues,pull_requests
; GITHUB_PERSONAL_ACCESS_TOKEN = your-read-only-token
; Or GitHub's hosted server, with no Docker (the token goes in MCP_GITHUB_TOKEN; its changes still ask):
; MCP_GITHUB = https://api.githubcopilot.com/mcp/
; MCP_GITHUB_TOKEN = your-read-only-token
; The "Kraken tools" block starts Kraken's own server from kraken-cli (https://docs.kraken.com/home/mcp) by itself.
; For your account it needs a Kraken API key with the fewest permissions it can: query only, unless the program trades,
; and never withdrawal. Prices and paper trading need no key. MCP_KRAKEN chooses Kraken's services yourself; never add
; --allow-dangerous (--doctor fails if you do). Tools that can move money always ask, and never run unattended.
; Trust Wallet's Agent Kit (npm install -g @trustwallet/cli; https://developer.trustwallet.com/developer/agent-sdk) gives
; an agent your self-custody wallet: balances, prices, history, swap quotes and token risk checks. Name it trustwallet.
; Transfers, swaps, token approvals and payments always ask, and never run unattended; so does any tool not known to
; be safe. Automations (create_automation) are never offered: they trade later, where nothing here can ask. On-chain
; sends can't be undone, so set it up with twak init and twak wallet create first, and keep the wallet's password in
; your system's keychain (twak's default) rather than here.
; MCP_TRUSTWALLET = twak serve
; TWAK_ACCESS_ID = your-access-id
; TWAK_HMAC_SECRET = your-hmac-secret
; KRAKEN_API_KEY = your-key
; KRAKEN_API_SECRET = your-secret
; MCP_KRAKEN = kraken mcp -s market,account,paper

[service addresses]
; =====================================================================================================
; Only needed to point a service somewhere else: a proxy, a different region, or your own server.
; ANTHROPIC_BASE_URL and GEMINI_BASE_URL change where Claude's and Gemini's APIs are (for a proxy, say).
; ANTHROPIC_BASE_URL = https://api.anthropic.com
; GEMINI_BASE_URL = https://generativelanguage.googleapis.com
; Llama runs on any OpenAI-compatible server; this is Ollama on this computer. LLAMA_API_KEY only if
; that server needs one.
; LLAMA_BASE_URL = http://localhost:11434/v1
; LLAMA_API_KEY =
; DEEPSEEK_BASE_URL = https://api.deepseek.com
; XAI_BASE_URL = https://api.x.ai/v1
; OPENAI_BASE_URL = https://api.openai.com/v1
; MISTRAL_BASE_URL = https://api.mistral.ai/v1
; QWEN_BASE_URL = https://dashscope-intl.aliyuncs.com/compatible-mode/v1
; MOONSHOT_BASE_URL = https://api.moonshot.ai/v1
; HF_BASE_URL = https://router.huggingface.co/v1
; GROQ_BASE_URL = https://api.groq.com/openai/v1
; ZAI_BASE_URL = https://api.z.ai/api/paas/v4
; MINIMAX_BASE_URL = https://api.minimax.io/v1
; OPENROUTER_BASE_URL = https://openrouter.ai/api/v1
; PERPLEXITY_BASE_URL = https://api.perplexity.ai


; =====================================================================================================
[for testing]
; =====================================================================================================
; Makes every listener (email, feeds, folders, GitHub, calendar, Homey) check this often, in seconds,
; instead of its usual pace. Handy while you try a program out; don't leave it on.
; RB_POLL_SECONDS = 5
