; =====================================================================================================
;  second-thought.example.ini: every setting an exported Second Thought program understands
; =====================================================================================================
;
;  How to use it
;  -------------
;  Every exported program comes with its own second-thought.ini, holding just the settings that program
;  needs. This file lists all of them, with notes, so you can see what's possible or build one ini that
;  serves all your programs.
;
;  Copy it to second-thought.ini, then fill in what you use. The program looks for second-thought.ini:
;    1. wherever SECOND_THOUGHT_INI points (an environment variable, not a setting in this file)
;    2. next to the program
;    3. in the folder you run it from
;    4. in your home folder (so one file can serve every program)
;  It uses the first one it finds.
;
;  Rules
;  -----
;  - Lines starting with ; or # are notes. Most settings below are notes: remove the ; to use one.
;  - A setting left empty (NAME = ) is ignored, so the blank keys below are safe to leave as they are.
;  - Upper or lower case doesn't matter in names. The [section] headings are only for tidiness: any
;    setting works in any section.
;  - A real environment variable with the same name wins over this file.
;  - A value can't contain " ;" or " #" (a space then ; or #): everything after it counts as a note.
;    Quotes round a value are removed, so "my value" and my value are the same.
;  - Keep this file private once it holds keys. Don't email it or put it on GitHub.


; =====================================================================================================
[keys]
; =====================================================================================================
; Only the services your program uses need a key. Each is billed by that service, separately from
; claude.ai. The address after each name is where to get a key.

; Claude: https://console.anthropic.com. Every program needs this one.
ANTHROPIC_API_KEY =

; Gemini: https://aistudio.google.com. GOOGLE_API_KEY works too. Needs: pip install google-genai
GEMINI_API_KEY =
; GOOGLE_API_KEY =

; DeepSeek: https://platform.deepseek.com
DEEPSEEK_API_KEY =

; Grok, from xAI: https://console.x.ai
XAI_API_KEY =

; OpenAI: https://platform.openai.com (an API account, not a ChatGPT plan)
OPENAI_API_KEY =

; Mistral: https://console.mistral.ai
MISTRAL_API_KEY =

; Qwen, from Alibaba Cloud Model Studio: https://modelstudio.console.alibabacloud.com. QWEN_API_KEY works too.
DASHSCOPE_API_KEY =
; QWEN_API_KEY =

; Kimi, from Moonshot AI: https://platform.moonshot.ai. KIMI_API_KEY works too.
MOONSHOT_API_KEY =
; KIMI_API_KEY =

; Open models on Hugging Face: https://huggingface.co/settings/tokens. HUGGINGFACE_API_KEY works too.
HF_TOKEN =
; HUGGINGFACE_API_KEY =

; Groq (very fast open models): https://console.groq.com
GROQ_API_KEY =

; GLM, from Z.ai: https://z.ai/manage-apikey/apikey-list. ZHIPUAI_API_KEY works too.
ZAI_API_KEY =
; ZHIPUAI_API_KEY =

; MiniMax: https://platform.minimax.io
MINIMAX_API_KEY =

; OpenRouter, one key for hundreds of models: https://openrouter.ai/keys
OPENROUTER_API_KEY =

; Perplexity (always searches the web): https://www.perplexity.ai/account/api
PERPLEXITY_API_KEY =


; =====================================================================================================
[models]
; =====================================================================================================
; primary: the model that does every step. Leave it as a note to use the one chosen on the page when
; the program was exported. ('model' means the same.)
;   Claude:      quick, default, complex
;   Gemini:      gemini-quick, gemini-default, gemini-complex
;   Llama:       llama-quick, llama-default, llama-complex
;   DeepSeek:    deepseek-default, deepseek-complex
;   Grok (xAI):  xai-default, xai-complex
;   OpenAI:      openai-quick, openai-default, openai-complex
;   Mistral:     mistral-quick, mistral-default, mistral-complex
;   Qwen:        qwen-quick, qwen-default, qwen-complex
;   Kimi:        kimi-default, kimi-complex
;   Perplexity:  perplexity-quick, perplexity-default, perplexity-complex
;   Hugging Face: hf-quick, hf-default, hf-complex
;   Groq:        groq-quick, groq-default, groq-complex
;   GLM:         glm-default, glm-complex
;   MiniMax:     minimax-quick, minimax-default
;   OpenRouter:  openrouter-default (it picks a model each step), or openrouter:<any model name from
;                https://openrouter.ai/models>, like openrouter:mistralai/mistral-small
; primary = default

; backups: models to try, in order, when the primary fails on a step (no key, out of credit, service
; down). Separate them with commas. backups = none turns off the backups set when the program was exported.
; backups = openai-default, gemini-default

; Model names change over time. To use a different model for a tier, without editing the program, add
; MODEL_<tier> with the tier's name in capitals and - as _ (so openai-default is MODEL_OPENAI_DEFAULT):
; MODEL_QUICK = claude-haiku-4-5-20251001
; MODEL_DEFAULT = claude-sonnet-5-5
; MODEL_COMPLEX = claude-opus-5-5
; MODEL_GEMINI_DEFAULT = gemini-3.8-flash
; MODEL_OPENAI_DEFAULT = gpt-6.1-sol
; MODEL_LLAMA_DEFAULT = llama3.2-vision:11b
; The provider's own pages list the current names; each tier's note in the program says where.

; Where a service's text models can't look at pictures, pictures go to one of its models that can:
; QWEN_VISION_MODEL = qwen3-vl-plus
; GROQ_VISION_MODEL = qwen/qwen3.8-27b
; HF_VISION_MODEL = google/gemma-4-31B-it


; =====================================================================================================
[run]
; =====================================================================================================
; budget: stop a run before a model call once it has used this many tokens (sent plus received).
; 0, or leaving it out, means no limit. A 'set token budget' block in the program wins over this.
; budget = 50000

; max_seconds: stop any run that takes longer than this, in seconds, whatever it's doing. 0, or leaving
; it out, means no limit (each run is still limited to 60 model calls and 20,000 steps).
; max_seconds = 900

; call_timeout: give up on one model call after this many seconds. 300 if you leave it out;
; 0 means no timeout (a call waits as long as the service takes).
; A number that isn't a number (budget, max_seconds, call_timeout) stops the program with a message saying which.
; call_timeout = 120

; save_log = yes writes each run's log, with every prompt sent, to the logs folder next to the program.
; save_log = yes

; stream: show Claude writing as it goes. Normally only when you run the program in a terminal yourself.
; stream = yes

; resume: if a run stopped part-way, pick up where it stopped next time, reusing the answers it already
; had. yes or no. Normally it asks you in a terminal, and doesn't resume when nobody is there to ask.
; resume = yes

; Where 'forever' and timed memories are kept. Normally memory.json, next to the program. Two programs
; can share one file, but not while both are writing to it: whichever saves last wins.
; RB_MEMORY_FILE = C:\Users\me\second-thought-memory.json


; =====================================================================================================
[feeds and pages]
; =====================================================================================================
; feeds: your news feeds (RSS or Atom addresses), separated by spaces. 'news from feed' with nothing in
; it, the news feed tool and the 'when there's something new in feed' listener read these.
; feeds = https://example.com/feed.xml https://example.org/atom.xml

; local_pages = yes lets the agent read web pages and feeds on your own network too. Normally it only
; reads public ones, in case something it reads tries to steer it at your router or your server.
; Addresses in your own settings (feeds, CALENDAR_URL) are always allowed.
; local_pages = yes


; =====================================================================================================
[home assistant]
; =====================================================================================================
; Your Home Assistant's address, and a long-lived access token: in Home Assistant, open your profile,
; then the Security tab, then 'Long-lived access tokens'.
HA_URL = http://homeassistant.local:8123
HA_TOKEN =
; The text-to-speech service the 'say … on' block uses.
; HA_TTS_ENTITY = tts.home_assistant_cloud


; =====================================================================================================
[homey]
; =====================================================================================================
; Your Homey's address, and an API key: in the Homey Web App (my.homey.app), Settings, API Keys,
; New API Key. Give it only what your programs need: view devices, control devices, view and start
; flows, view and edit Logic.
;   Homey Pro:                 http://homey-XXXXXXX.local, or its IP address
;   Homey Self-Hosted Server:  the computer's IP address and port 4859, like http://192.168.1.20:4859
;                              (devices on a Homey Bridge connected to it show up there too)
; HOMEY_URL = http://192.168.1.20:4859
HOMEY_API_KEY =


; =====================================================================================================
[mqtt]
; =====================================================================================================
; Your MQTT broker, for example Mosquitto in Home Assistant. Needs: pip install paho-mqtt
; (run.bat and run.sh install it when the program uses MQTT).
; MQTT_HOST = homeassistant.local
; MQTT_PORT = 1883
; MQTT_USERNAME =
; MQTT_PASSWORD =
; MQTT_TLS = yes makes the connection encrypted (and the port 8883 unless you set one).
; MQTT_TLS = yes


; =====================================================================================================
[telegram]
; =====================================================================================================
; Make a bot: in Telegram, message @BotFather and send /newbot. It gives you the token.
TELEGRAM_BOT_TOKEN =
; Your own chat with the bot. Send the bot a message, run a Telegram program, and it tells you the
; number. Anyone can message a bot, so it only listens to, and searches, the chats listed here.
; Several chats can be separated by spaces; messages are sent to the first one.
TELEGRAM_CHAT_ID =
; Only if you use a Telegram Bot API server of your own.
; TELEGRAM_API_URL = https://api.telegram.org


; =====================================================================================================
[discord]
; =====================================================================================================
; A bot: Discord Developer Portal (discord.com/developers), New Application, Bot, Reset Token. On the
; same page turn on 'Message Content Intent', then invite the bot to your server (OAuth2, URL Generator,
; scope bot, permissions Read Message History and Send Messages).
DISCORD_BOT_TOKEN =
; The channels it reads and posts in: right-click a channel, Copy Channel ID (turn on Developer Mode in
; Discord's settings first). Anyone in a server can post, so only these channels count. Several can be
; separated by spaces; messages are sent to the first one unless they're a reply.
DISCORD_CHANNEL_ID =
; Only for testing against a stand-in.
; DISCORD_API_URL = https://discord.com/api/v10


; =====================================================================================================
[slack]
; =====================================================================================================
; A Slack app (api.slack.com/apps): OAuth & Permissions, bot token scopes channels:history,
; groups:history and chat:write. Install it to your workspace and copy the Bot User OAuth Token (xoxb-…).
SLACK_BOT_TOKEN =
; The channels it reads and posts in: open a channel's details; its ID is at the bottom. Invite the bot to
; each with /invite @yourbot. Several can be separated by spaces; messages go to the first one unless
; they're a reply.
SLACK_CHANNEL_ID =
; Only for testing against a stand-in.
; SLACK_API_URL = https://slack.com/api


; =====================================================================================================
[email]
; =====================================================================================================
; Your address and an app password, not your normal password (Gmail: Google account, Security,
; App passwords). Gmail, iCloud, Yahoo and Fastmail work out their own servers.
EMAIL_ADDRESS =
EMAIL_PASSWORD =
; For any other provider, fill in its servers (its help pages list them).
; EMAIL_IMAP_HOST = imap.example.com
; EMAIL_IMAP_PORT = 993
; EMAIL_SMTP_HOST = smtp.example.com
; EMAIL_SMTP_PORT = 465   (465 is encrypted from the start; 587 starts plain and switches to encryption)
; EMAIL_SSL = no only for a mail server on your own network that doesn't do encryption.
; EMAIL_SSL = yes


; =====================================================================================================
[calendar]
; =====================================================================================================
; Your calendar's private iCal address. Several can go on one line, separated by spaces.
;   Google Calendar: Settings, your calendar, 'Secret address in iCal format'
;   Outlook: Settings, Calendar, Shared calendars, Publish a calendar, ICS link
;   iCloud: share the calendar as a public calendar and copy its address (webcal:// works)
CALENDAR_URL =


; =====================================================================================================
[github]
; =====================================================================================================
; A token from https://github.com/settings/tokens. Fine-grained: read access to contents, issues and
; pull requests; to let the agent comment, pull requests and issues need read and write.
GITHUB_TOKEN =
; Only for GitHub Enterprise Server.
; GITHUB_API_URL = https://github.example.com/api/v3


; =====================================================================================================
[web requests]
; =====================================================================================================
; For 'when a web request arrives at /…'. Every request must carry this password, as ?key=… on the
; address or in an X-Second-Thought-Key header, or it's refused. Make it long. Until it's set, the
; program doesn't listen for web requests at all.
WEBHOOK_SECRET =
; The port to listen on, and the address: 0.0.0.0 (the default) means every network the computer is
; on, so Home Assistant or your phone can reach it; 127.0.0.1 means only this computer.
; WEBHOOK_PORT = 8765
; WEBHOOK_HOST = 0.0.0.0


; =====================================================================================================
[service addresses]
; =====================================================================================================
; Only needed to point a service somewhere else: a proxy, a different region, or your own server.
; Llama runs on any OpenAI-compatible server; this is Ollama on this computer. LLAMA_API_KEY only if
; that server needs one.
; LLAMA_BASE_URL = http://localhost:11434/v1
; LLAMA_API_KEY =
; DEEPSEEK_BASE_URL = https://api.deepseek.com
; XAI_BASE_URL = https://api.x.ai/v1
; OPENAI_BASE_URL = https://api.openai.com/v1
; MISTRAL_BASE_URL = https://api.mistral.ai/v1
; QWEN_BASE_URL = https://dashscope-intl.aliyuncs.com/compatible-mode/v1
; MOONSHOT_BASE_URL = https://api.moonshot.ai/v1
; HF_BASE_URL = https://router.huggingface.co/v1
; GROQ_BASE_URL = https://api.groq.com/openai/v1
; ZAI_BASE_URL = https://api.z.ai/api/paas/v4
; MINIMAX_BASE_URL = https://api.minimax.io/v1
; OPENROUTER_BASE_URL = https://openrouter.ai/api/v1
; PERPLEXITY_BASE_URL = https://api.perplexity.ai


; =====================================================================================================
[for testing]
; =====================================================================================================
; Makes every listener (email, feeds, folders, GitHub, calendar, Homey) check this often, in seconds,
; instead of its usual pace. Handy while you try a program out; don't leave it on.
; RB_POLL_SECONDS = 5
