# Ruff: python -m ruff check  (CI runs it; pip install ruff). Errors only, no style (#313).
target-version = "py39"
line-length = 160
include = ["python/second_thought/*.py", "tools/*.py"]

[lint]
# F: pyflakes (unused and undefined names, shadowed imports). B: bugbear's likely bugs. E9: syntax errors.
select = ["F", "B", "E9"]
ignore = [
    "B904",  # raise ... from inside except: our RunError messages are the point, the chained traceback isn't shown
    "B905",  # zip(strict=): needs Python 3.10, and exported programs run on 3.9
]

[lint.per-file-ignores]
# settings.py is the top of python/runtime.py, so its imports are the whole runtime's: the other parts use them.
"python/second_thought/settings.py" = ["F401"]
