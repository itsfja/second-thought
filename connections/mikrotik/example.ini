; =====================================================================================================
[mikrotik]
; =====================================================================================================
; A MikroTik router or switch, for the MikroTik blocks, which only read. In RouterOS: turn on the www-ssl
; service, make a group with only the read, api and rest-api policies, and a user in it. Run --doctor
; once: it shows the router's certificate fingerprint for MIKROTIK_CERT_SHA256.
; MIKROTIK_URL = https://192.168.88.1
; MIKROTIK_USER = monitor
; MIKROTIK_PASSWORD =
; MIKROTIK_CERT_SHA256 =
