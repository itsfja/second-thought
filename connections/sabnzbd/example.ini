; =====================================================================================================
[sabnzbd]
; =====================================================================================================
; Your SABnzbd, for the SABnzbd blocks: its address and the full API key (Config, General, API Key),
; not the NZB key (that one only adds jobs). The blocks read the queue, the history and the download
; disk's free space; pause and resume ask first, and nothing else is ever sent. Run --doctor once: it
; shows the certificate fingerprint for SABNZBD_CERT_SHA256, if SABnzbd is behind HTTPS this computer
; doesn't trust.
SABNZBD_URL =
SABNZBD_API_KEY =
; SABNZBD_CERT_SHA256 =
