; =====================================================================================================
[proxmox]
; =====================================================================================================
; Your Proxmox VE cluster, for the Proxmox blocks. Make an API token (Datacenter, Permissions, API
; Tokens) for a user with the PVEAuditor role, plus VM.PowerMgmt if the program starts or stops guests.
; Run --doctor once: it shows the node's certificate fingerprint for PROXMOX_CERT_SHA256.
; PROXMOX_PROTECT lists VMIDs never started, stopped or rebooted, like 100, 101.
; PROXMOX_URL = https://pve.local:8006
; PROXMOX_TOKEN_ID = monitor@pve!second-thought
; PROXMOX_TOKEN_SECRET =
; PROXMOX_CERT_SHA256 =
; PROXMOX_PROTECT =
