; =====================================================================================================
[solax]
; =====================================================================================================
; A Solax inverter, for the Solax block, which only reads from SolaxCloud (the inverter's own local API is gone
; from newer firmware). Make a free token on the API page of https://www.solaxcloud.com, and find the Registration
; No. of the inverter's wifi dongle (on its label, or in the app). The cloud updates about every five minutes and
; allows ten calls a minute, so each read is kept that long. SOLAX_API_URL points at another region's cloud.
; SOLAX_TOKEN_ID = 20240722185111234567890
; SOLAX_SN = ABCDEFGHIJ
; SOLAX_API_URL = https://www.eu.solaxcloud.com:9443/proxy/api/getRealtimeInfo.do
