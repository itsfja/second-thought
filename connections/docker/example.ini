; =====================================================================================================
[docker]
; =====================================================================================================
; Your Docker containers, for the Docker blocks. With nothing set, it's the socket on this computer
; (unix:///var/run/docker.sock). That socket is root on the machine: safer is a socket proxy
; (tecnativa/docker-socket-proxy with CONTAINERS=1, plus ALLOW_RESTARTS=1 and ALLOW_START=1 only if the
; program restarts, stops or starts containers; leave POST off), with DOCKER_HOST pointing at it. For TLS, set DOCKER_TLS_VERIFY = 1 and
; DOCKER_CERT_PATH to the folder with ca.pem, cert.pem and key.pem, as for the docker command.
; DOCKER_PROTECT lists containers never restarted, stopped or started, like socket-proxy, homeassistant.
; DOCKER_HOST = tcp://docker.local:2375
; DOCKER_TLS_VERIFY =
; DOCKER_CERT_PATH =
; DOCKER_PROTECT =
