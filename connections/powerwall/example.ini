; =====================================================================================================
[powerwall]
; =====================================================================================================
; A Tesla Powerwall, Powerwall 2 or Powerwall+ (the Powerwall 3 has no local web API: use Home Assistant or
; Teslemetry for one of those), for the Powerwall blocks. The customer password is the last five characters of the
; one on the gateway's QR sticker, unless you changed it. Only reading and, after asking, the backup reserve are
; ever sent: no firmware, storm watch or operation mode. Run --doctor once: it shows the gateway's certificate
; fingerprint for POWERWALL_CERT_SHA256. Setting the reserve always asks, and never runs unattended.
; POWERWALL_URL = https://192.168.1.50
; POWERWALL_PASSWORD =
; POWERWALL_EMAIL = you@example.com
; POWERWALL_CERT_SHA256 =
