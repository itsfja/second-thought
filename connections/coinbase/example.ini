; =====================================================================================================
[coinbase]
; =====================================================================================================
; A Coinbase API key, for the Coinbase blocks: at portal.cdp.coinbase.com, API Keys, Create API key.
; Choose ECDSA under its advanced settings, limit it to one portfolio, and give it View permission only,
; unless the program places orders (then View and Trade). Never give it Transfer. Save the key file it
; downloads next to the program and name it here, or put the file's contents in COINBASE_KEY (in the
; keychain, say). Values are in the currency under [run]. Needs: pip install cryptography
; (run.bat and run.sh install it when the program uses Coinbase).
; COINBASE_KEY_FILE = cdp_api_key.json
; Or the key file's contents, on one line (the keychain or a GitHub secret can hold it):
; COINBASE_KEY =
; COINBASE_API_URL = https://api.coinbase.com
