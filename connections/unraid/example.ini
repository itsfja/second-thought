; =====================================================================================================
[unraid]
; =====================================================================================================
; Your Unraid server, for the Unraid blocks: its address and an API key (Settings, Management Access,
; API Keys; the API is built into Unraid 7.2 and later, the Unraid Connect plugin before that). The
; blocks read the array, the disks, the shares, the containers and the VMs; start, stop and a parity
; check ask first, and nothing else is ever sent. Run --doctor once: it shows the certificate
; fingerprint for UNRAID_CERT_SHA256, if Unraid is behind HTTPS this computer doesn't trust.
UNRAID_URL =
UNRAID_API_KEY =
; UNRAID_CERT_SHA256 =
